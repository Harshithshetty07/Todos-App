services:

  backend:
    build:
      context: ./server/TodoApi
      dockerfile: Dockerfile

    container_name: todo-backend-dev

    ports:
      - "7501:7501"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7501

    volumes:
      - ./server/TodoApi:/src
      - todo-data-dev:/app/data

    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: todo-frontend-dev

    ports:
      - "3035:80"

    volumes:
      - ./client:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  todo-data-dev: